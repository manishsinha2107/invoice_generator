name: Tradetron Mark As Paid Sync

on:
  workflow_dispatch:  # Allows manual triggering from GitHub UI or external cron services (e.g. cron-job.org)

jobs:
  mark-paid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase python-dotenv requests
          playwright install chromium

      - name: Run Mark Paid Automation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TT_CREATOR_EMAIL: ${{ secrets.TT_CREATOR_EMAIL }}
          TT_CREATOR_PASSWORD: ${{ secrets.TT_CREATOR_PASSWORD }}
          ENVIRONMENT: production  # Change to development if testing against dev ledger
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHANNEL_ID: ${{ secrets.ADMIN_CHANNEL_ID }}
        run: |
          python mark_paid_tt.py
