# [MODULE/CLASS SSOT ROLE]: Ingestion Pipeline Trigger
# [FUNCTION CONTRACT & MATH]: Orchestrates the secure execution environment for the Python PDF parser, injecting all required cryptographic and operational secrets.

name: Manual Invoice Ingestion

# [TECHNICAL]: Exposes the workflow strictly to manual UI clicks and external REST API POST requests.
# [TRADING DOMAIN]: Prevents accidental double-runs or schedule spam, giving the admin total control over when billing cycles are processed.
on:
  workflow_dispatch:

jobs:
  process_invoices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      # [TECHNICAL]: Maps GitHub repository secrets into the isolated runner environment, protecting keys from source control.
      # [TRADING DOMAIN]: Connects the isolated backend worker to the live Supabase ledger, automated notification APIs, and Google Drive repositories.
      - name: Run Invoice Ingestor
        env:
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INVOICE_SOURCE_FOLDER: ${{ secrets.INVOICE_SOURCE_FOLDER }}
          INVOICE_DEST_FOLDER: ${{ secrets.INVOICE_DEST_FOLDER }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python scripts/invoice_ingestor.py
